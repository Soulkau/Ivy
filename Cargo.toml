[package]
name = "ivy"
version = "0.1.0"
edition = "2024"

[workspace]
members=["ivy-core", "ivy-types", "ivy-macros"]
resolver="2"
exclude = [
    "templates"
]
[workspace.dependencies]
talky = { git = "https://github.com/Soulkau/Talky.git", tag="v0.1" }

# Main
trouble-host = "0.5.0"
static_cell = "2.1.1"
heapless = "0.9.2"
log = "0.4.29"
sequential-storage = "7.2.0"
postcard = "1.1.3"
serde = { version = "1.0.228", default-features = false }
async-trait = "0.1.89"
rand_core = "0.6.3"
futures-util = { version = "0.3.32", default-features = false }
pin-project = "1.1.11"
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
serde-json-core = "0.6.0"
enum_dispatch = {version ="0.3.13"}
const_panic = "0.2.15"
bbqueue = "0.7.0"
mqttrust = { git = "https://github.com/Soulkau/mqttrust.git", features = ["log", "embedded-tls", "mqttv3"], default-features=false  }
tracing = {version = "0.1.44", default-features = false }
thiserror = { version = "2.0.18", default-features = false }

#Embedded abtractions
embedded-io = "0.7.0"
embedded-io-async = "0.7.0"
embedded-time = "0.12.1"
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"
embedded-tls = { git = "https://github.com/drogue-iot/embedded-tls", rev = "426f327", default-features = false }
bt-hci = "0.6.0"
#Embassy
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "udp", "dns", "dhcpv4"] }
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
embassy-embedded-hal = "0.6.0"
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"
# Macros
proc-macro2 = "1.0.106"
quote = "1.0.42"
syn = {version = "3.0.3", features = ["full"] }
heck = "0.5.0"
paste = "1.0.15"

# Tests
tokio = {version = "1.53.1", features = ["full"] }

tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
critical-section = { version = "1.2.0", features = ["std"] }


[dependencies]
ivy-core = { path = "./ivy-core" }
ivy-macros = { path = "./ivy-macros" }
ivy-types = { path = "./ivy-types" }
