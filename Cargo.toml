[package]
name = "rapid"
version = "0.1.0"
edition = "2024"

[workspace]
members=["rapid-core", "rapid-types", "rapid-macros"]
resolver="2"
[workspace.dependencies]
talky = { path = "../talky" }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-time = "0.12.1"
embedded-storage = "0.3.1"
embedded-storage-async = "0.4.1"
bt-hci = "0.6.0"
trouble-host = "0.5.0"
embassy-executor = { version = "0.9.0", features = [] }
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
embassy-sync = "0.7.0"
embassy-embedded-hal = "0.6.0"
static_cell = "2.1.1"
heapless = "0.9.2"
log = "0.4.29"
sequential-storage = "7.2.0"
postcard = "1.1.3"
serde = { version = "1.0.228", default-features = false }
async-trait = "0.1.89"
rand_core = "0.9.2"
futures-util = { version = "0.3.32", default-features = false }
pin-project = "1.1.11"
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
serde-json-core = "0.6.0"
defmt = "1.1.1"
enum_dispatch = {version ="0.3.13"}
const_panic = "0.2.15"

# Macros
proc-macro2 = "1.0.106"
quote = "1.0.42"
syn = {version = "3.0.3", features = ["full"] }
heck = "0.5.0"

# Tests
tokio = {version = "1.53.1", features = ["full"] }


[dependencies]
rapid-core = { path = "./rapid-core" }
rapid-macros = { path = "./rapid-macros" }
rapid-types = { path = "./rapid-types" }
